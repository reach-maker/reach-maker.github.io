<title>リーチ演出メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 雀卓のフェルトを地に、左にプレビュー（16:9 / 9:16 / 1:1）、右に設定パネル。狭い画面では縦一列。 */
:root {
  --felt: #0d1613;
  --panel: #14221d;
  --panel-2: #1a2c25;
  --line: #27403446;
  --line-strong: #2f4b3e;
  --ivory: #efe7d3;
  --muted: #98aa9e;
  --gold: #e3ae47;
  --gold-ink: #241703;
  --jade: #3fae7d;
  --red: #e0493b;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--felt);
  background-image: radial-gradient(ellipse at 30% 0%, #17322688, transparent 60%);
  color: var(--ivory);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
}
.wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 20px;
}
header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.tile {
  width: 46px; height: 60px; border-radius: 7px;
  background: linear-gradient(#fbf6e8, #e4dbc2);
  box-shadow: 0 4px 0 var(--jade), 0 6px 14px #0008;
  display: grid; place-items: center;
  font-family: "Shippori Mincho B1", serif; font-weight: 800; font-size: 30px; color: var(--red);
}
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); letter-spacing: 0.04em; line-height: 1.2; text-wrap: balance; }
.lead { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
@media (max-width: 960px) { main { grid-template-columns: minmax(0, 1fr); } }

.stage-col { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 961px) { .stage-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.stage-box {
  position: relative;
  background: #050807;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  padding: 10px;
  display: grid; place-items: center;
  min-height: 200px;
}
#stage { display: block; max-width: 100%; max-height: 70vh; width: auto; height: auto; border-radius: 4px; }
.stage-box.drag { outline: 2px dashed var(--gold); outline-offset: -6px; }
.rec-badge {
  position: absolute; top: 18px; left: 18px;
  background: var(--red); color: #fff; font-weight: 700; font-size: 12px; letter-spacing: 0.12em;
  padding: 3px 10px; border-radius: 99px;
}
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls .spacer { flex: 1; }

button, .btn {
  font: inherit; font-weight: 700; cursor: pointer;
  border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--panel-2); color: var(--ivory);
  padding: 9px 16px; display: inline-flex; align-items: center; gap: 8px;
}
button:hover { border-color: #4a6b5b; }
button:focus-visible, input:focus-visible, select:focus-visible, label.chip:focus-within, .bgcard:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
button.primary:hover { background: #f0bf5c; }
button.rec { background: #3a1512; border-color: #6a2a23; color: #ffd9d3; }
button:disabled { opacity: 0.5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 12px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ivory); font-weight: 700; }
.msg { font-size: 13px; color: var(--muted); min-height: 1.4em; margin: 0; }
.msg.warn { color: #f3c37a; }

.result { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.result video { width: 100%; max-height: 50vh; background: #000; border-radius: 6px; }
.result h3 { margin: 0; font-size: 15px; }

.panel { display: grid; gap: 14px; min-width: 0; }
section.card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
section.card h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: var(--gold); }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.drop {
  border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 14px;
  display: flex; gap: 12px; align-items: center; cursor: pointer; background: var(--panel-2);
}
.drop:hover { border-color: var(--gold); }
.drop img { width: 52px; height: 52px; object-fit: contain; background: #0006; border-radius: 6px; flex: none; }
.drop strong { display: block; }
.drop span { font-size: 12.5px; color: var(--muted); }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.bggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.bgcard { padding: 0; border-radius: 8px; overflow: hidden; display: grid; gap: 0; background: var(--panel-2); border: 2px solid transparent; text-align: left; }
.bgcard canvas { width: 100%; aspect-ratio: 16 / 9; display: block; }
.bgcard span { padding: 5px 8px; font-size: 13px; }
.bgcard[aria-pressed="true"] { border-color: var(--gold); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
label.chip { position: relative; cursor: pointer; }
label.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
label.chip span {
  display: inline-block; padding: 6px 12px; border-radius: 99px;
  border: 1px solid var(--line-strong); background: var(--panel-2); font-size: 13.5px;
}
label.chip input:checked + span { background: var(--ivory); color: #13201b; border-color: var(--ivory); font-weight: 700; }
.sub-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }

.row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.row > label { font-size: 13px; color: var(--muted); }
.row output { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3.5em; text-align: right; }
input[type=range] { width: 100%; accent-color: var(--gold); }
input[type=text], select {
  font: inherit; width: 100%; padding: 7px 10px; border-radius: 7px;
  border: 1px solid var(--line-strong); background: #0b1411; color: var(--ivory);
}
input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line-strong); border-radius: 7px; background: #0b1411; padding: 2px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.check input { accent-color: var(--gold); width: 16px; height: 16px; }
.se-file { display: grid; gap: 10px; }
.inline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
</style>

<div class="wrap">
  <header>
    <div class="tile" aria-hidden="true">中</div>
    <div>
      <h1>リーチ演出メーカー</h1>
      <p class="lead">キャラ画像を入れて、背景と音を選ぶだけ。プレビューして、そのまま動画で書き出せます。</p>
    </div>
  </header>

  <main>
    <div class="stage-col">
      <div class="stage-box" id="stageBox">
        <canvas id="stage" width="1280" height="720" aria-label="リーチ演出のプレビュー"></canvas>
        <div class="rec-badge" id="recBadge" hidden>● REC</div>
      </div>
      <div class="controls">
        <button class="primary" id="playBtn" type="button">▶ 再生</button>
        <button class="rec" id="recBtn" type="button">● 動画を書き出す</button>
        <button id="pngBtn" type="button">静止画を保存</button>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="画面比率" id="aspectSeg">
          <button type="button" data-aspect="16:9" aria-pressed="true">16:9</button>
          <button type="button" data-aspect="9:16" aria-pressed="false">9:16</button>
          <button type="button" data-aspect="1:1" aria-pressed="false">1:1</button>
        </div>
      </div>
      <p class="msg" id="msg">サンプルの「中」牌で表示中。キャラ画像はプレビューにドラッグ＆ドロップ、または貼り付け（⌘V）でも入れられます。</p>
      <div class="result" id="result" hidden>
        <h3>書き出した動画</h3>
        <video id="resultVideo" controls playsinline></video>
        <div class="controls">
          <button class="primary" id="saveBtn" type="button">保存する</button>
          <span class="hint" id="resultInfo"></span>
        </div>
      </div>
    </div>

    <div class="panel">
      <section class="card">
        <h2>キャラ画像</h2>
        <label class="drop" for="imgInput">
          <img id="imgThumb" alt="">
          <div><strong>画像を選ぶ</strong><span>背景を透過した PNG だと、縁が光ってきれいに出ます</span></div>
        </label>
        <input type="file" id="imgInput" accept="image/*">
        <div class="row"><label for="scale">大きさ</label><input type="range" id="scale" min="40" max="170" value="100"><output id="scaleOut">100%</output></div>
        <div class="row"><label for="posX">横位置</label><input type="range" id="posX" min="-60" max="60" value="0"><output id="posXOut">0</output></div>
        <div class="row"><label for="posY">縦位置</label><input type="range" id="posY" min="-40" max="60" value="0"><output id="posYOut">0</output></div>
        <label class="check"><input type="checkbox" id="flip"> 左右反転</label>
      </section>

      <section class="card">
        <h2>背景</h2>
        <div class="bggrid" id="bgGrid"></div>
        <div id="bgCustomRow" hidden>
          <label class="drop" for="bgInput">
            <img id="bgThumb" alt="">
            <div><strong>背景画像を選ぶ</strong><span>ゆっくりズームしながら表示します</span></div>
          </label>
          <input type="file" id="bgInput" accept="image/*">
        </div>
        <div class="inline">
          <label class="check" for="accent">アクセント色 <input type="color" id="accent" value="#ff3cac"></label>
          <label class="check"><input type="checkbox" id="luxe" checked> キラキラ演出を重ねる</label>
        </div>
      </section>

      <section class="card">
        <h2>効果音</h2>
        <div class="chips" id="seChips"></div>
        <div id="seFileRow" class="se-file" hidden>
          <label class="drop" for="seInput">
            <div><strong id="seFileName">効果音ファイルを選ぶ</strong><span>mp3 / wav / m4a。「立直」が出る瞬間に合わせて鳴り、動画にも入ります</span></div>
          </label>
          <input type="file" id="seInput" accept="audio/*">
          <div class="row"><label for="seOffset">タイミング</label><input type="range" id="seOffset" min="-100" max="100" value="0"><output id="seOffsetOut">±0.00秒</output></div>
          <p class="hint">マイナスにすると「立直」が出る前から鳴り始めます。</p>
        </div>
        <div class="row"><label for="seVol">音量</label><input type="range" id="seVol" min="0" max="100" value="80"><output id="seVolOut">80</output></div>
      </section>

      <section class="card">
        <h2>文字</h2>
        <div class="row"><label for="mainText">メイン</label><input type="text" id="mainText" value="立直" maxlength="8"><span></span></div>
        <div class="row"><label for="subText">サブ</label><input type="text" id="subText" value="" placeholder="例：東家 ハヤカワ" maxlength="24"><span></span></div>
        <div class="row"><label for="font">書体</label>
          <select id="font">
            <option value="dela">極太ゴシック</option>
            <option value="fude">筆文字</option>
            <option value="mincho">太明朝</option>
          </select><span></span></div>
        <div class="row"><label for="bandMode">帯の文字</label>
          <select id="bandMode">
            <option value="main">メイン文字を流す</option>
            <option value="none">模様だけ</option>
            <option value="custom">自由に入力</option>
          </select><span></span></div>
        <div class="row" id="bandTextRow" hidden><label for="bandText">帯に流す文字</label><input type="text" id="bandText" value="一発ツモ" maxlength="16"><span></span></div>
        <div class="inline">
          <label class="check"><input type="checkbox" id="vertical"> 縦書き</label>
          <label class="check"><input type="checkbox" id="stick" checked> 千点棒を出す</label>
        </div>
        <div class="row"><label for="hold">見せる長さ</label><input type="range" id="hold" min="12" max="40" value="18"><output id="holdOut">1.8秒</output></div>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
const $ = (s) => document.querySelector(s);
const cv = $('#stage'), ctx = cv.getContext('2d');
const SIZES = { '16:9': [1280, 720], '9:16': [720, 1280], '1:1': [1080, 1080] };
const T_IMP = 0.5;
let curT = 0, offCv = null;

const st = {
  aspect: '16:9', bg: 'niji', se: 'kyuin', luxe: true,
  img: null, bgImg: null, seBuf: null, seName: '', seOffset: 0,
  accent: '#ff3cac', light: '#ffffff',
  text: '立直', sub: '', bandMode: 'main', bandText: '一発ツモ', font: 'dela', vertical: false, stick: true,
  scale: 1, posX: 0, posY: 0, flip: false, hold: 1.8,
  seVol: 0.8,
};

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const outCubic = (k) => 1 - Math.pow(1 - k, 3);
const inCubic = (k) => k * k * k;
const outBack = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function hexRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); }
function mix(h, to, k) { const a = hexRgb(h), b = hexRgb(to); return 'rgb(' + a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',') + ')'; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const timeline = () => { const ex = T_IMP + st.hold; return { ex, end: ex + 0.6 }; };
const heroT = () => T_IMP + 1.0;

function rays(c, x, y, R, n, rot, color) {
  c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = color;
  const step = Math.PI * 2 / n;
  for (let i = 0; i < n; i += 2) {
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R, i * step, (i + 1) * step); c.closePath(); c.fill();
  }
  c.restore();
}
function fillGrad(c, W, H, x, y, r, stops) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

// ---------- backgrounds ----------
function star(c, x, y, r, a, color) {
  c.save(); c.globalAlpha = a; c.fillStyle = color;
  c.beginPath(); c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
  c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fill();
  c.strokeStyle = color; c.lineWidth = Math.max(1, r * 0.06); c.globalAlpha = a * 0.6;
  c.beginPath(); c.moveTo(x - r * 2.4, y); c.lineTo(x + r * 2.4, y); c.moveTo(x, y - r * 2.4); c.lineTo(x, y + r * 2.4); c.stroke();
  c.restore();
}
// 豪華エフェクト: どの背景にも重ねる光の層（ボケ玉・逆回転の光線・光の帯・きらめき・レンズフレア・周辺減光）
function luxe(c, t, W, H, s, L) {
  const R = Math.hypot(W, H);
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const r = (30 + rnd(i + 50) * 90) * s;
    const x = (rnd(i + 51) * W * 1.2 + t * (10 + rnd(i + 52) * 30) * s) % (W * 1.2) - W * 0.1;
    const y = rnd(i + 53) * H + Math.sin(t + i) * 20 * s;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    const col = i % 3 ? st.light : st.accent;
    g.addColorStop(0, rgbaAny(col, 0.16)); g.addColorStop(0.7, rgbaAny(col, 0.08)); g.addColorStop(1, rgbaAny(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  rays(c, L.tx, L.ty, R, 14, -t * 0.6, 'rgba(255,255,255,0.05)');
  // diagonal light sweeps
  for (const st0 of [0.15, T_IMP + 0.35, T_IMP + 1.55, T_IMP + 2.75]) {
    const k = (t - st0) / 0.6; if (k < 0 || k > 1) continue;
    const x = lerp(-W * 0.4, W * 1.4, outCubic(k));
    c.save(); c.translate(x, H / 2); c.rotate(0.35);
    const g = c.createLinearGradient(-90 * s, 0, 90 * s, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${0.35 * (1 - k * 0.5)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(-90 * s, -R, 180 * s, R * 2); c.restore();
  }
  // lens flare at the text after impact
  const fk = clamp((t - T_IMP) / 0.3);
  if (fk > 0) {
    const pulse = 0.75 + Math.sin(t * 7) * 0.12;
    const fg = c.createRadialGradient(L.tx, L.ty, 0, L.tx, L.ty, 260 * s);
    fg.addColorStop(0, `rgba(255,255,255,${0.5 * fk * pulse})`); fg.addColorStop(0.3, rgbaAny(st.light, 0.25 * fk)); fg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = fg; c.fillRect(0, 0, W, H);
    const sg = c.createLinearGradient(0, 0, W, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(clamp(L.tx / W), `rgba(255,255,255,${0.55 * fk * pulse})`); sg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sg; c.fillRect(0, L.ty - 3 * s, W, 6 * s);
    [0.35, 0.6, 0.85].forEach((d, i) => {
      const fx = lerp(L.tx, W - L.tx, d), fy = lerp(L.ty, H - L.ty, d), fr = (30 + i * 22) * s;
      const hg = c.createRadialGradient(fx, fy, 0, fx, fy, fr);
      hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(0.8, rgbaAny(st.accent, 0.18 * fk)); hg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = hg; c.beginPath(); c.arc(fx, fy, fr, 0, 7); c.fill();
    });
  }
  c.restore();
  for (let i = 0; i < 34; i++) {
    const a = Math.max(0, Math.sin(t * 4.5 + i * 2.1));
    if (a < 0.1) continue;
    star(c, rnd(i + 70) * W, rnd(i + 71) * H, (5 + rnd(i + 72) * 12) * s * a, a, '#ffffff');
  }
  const vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, R * 0.6);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
}
function rgbaAny(col, a) {
  if (col[0] === '#') return rgba(col, a);
  return col.replace('rgb(', 'rgba(').replace(')', `,${a})`);
}

const BG = {
  niji: { name: '虹', accent: '#ff3cac', light: '#ffffff', draw(c, t, W, H, s, L) {
    const R = Math.hypot(W, H);
    if (c.createConicGradient) {
      const g = c.createConicGradient(t * 0.9, L.tx, L.ty);
      for (let i = 0; i <= 12; i++) g.addColorStop(i / 12, `hsl(${i * 30},100%,56%)`);
      c.fillStyle = g;
    } else {
      const g = c.createLinearGradient(0, 0, W, H);
      for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsl(${i * 60},100%,56%)`);
      c.fillStyle = g;
    }
    c.fillRect(0, 0, W, H);
    rays(c, L.tx, L.ty, R, 40, -t * 0.5, 'rgba(255,255,255,0.2)');
    for (let k = 0; k < 5; k++) {
      const p = (k / 5 + t * 0.35) % 1;
      c.strokeStyle = `rgba(255,255,255,${0.45 * (1 - p)})`; c.lineWidth = (4 + 14 * (1 - p)) * s;

// ---------- fonts ----------
const FONTS = {
  dela: (px) => `${px}px "Dela Gothic One", "Hiragino Sans", sans-serif`,
  fude: (px) => `${px}px "Yuji Syuku", "Hiragino Mincho ProN", serif`,
  mincho: (px) => `800 ${px}px "Shippori Mincho B1", "Hiragino Mincho ProN", serif`,
};
const SUBFONT = (px) => `700 ${px}px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif`;
function loadFonts() {
  const txt = st.text + st.sub + st.bandText + '中立直\u25C6';
  return Promise.all([
    document.fonts.load(FONTS.dela(80), txt), document.fonts.load(FONTS.fude(80), txt),
    document.fonts.load(FONTS.mincho(80), txt), document.fonts.load(SUBFONT(40), txt),
  ]).catch(() => {});
}

// ---------- sample image: 中 tile ----------
function makeSample() {
  const c = document.createElement('canvas'); c.width = 560; c.height = 760;
  const x = c.getContext('2d');
  x.fillStyle = '#1f8a5a'; x.beginPath(); x.roundRect(40, 70, 480, 660, 46); x.fill();
  const g = x.createLinearGradient(0, 30, 0, 690); g.addColorStop(0, '#fffdf4'); g.addColorStop(1, '#e2d8bd');
  x.fillStyle = g; x.beginPath(); x.roundRect(40, 30, 480, 640, 46); x.fill();
  x.fillStyle = '#d8312a'; x.font = '800 400px "Shippori Mincho B1", "Hiragino Mincho ProN", serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('中', 280, 360);
  return c;
}

// ---------- layout ----------
function layout(W, H) {
  const s = Math.min(W, H) / 720;
  const portrait = H > W * 1.2, square = !portrait && W / H < 1.3;
  let tx, ty, cx, ch, maxTW;
  if (portrait) { tx = W * 0.5; ty = H * 0.25; cx = W * 0.5; ch = H * 0.64; maxTW = W * 0.88; }
  else if (square) { tx = W * 0.33; ty = H * 0.4; cx = W * 0.67; ch = H * 0.86; maxTW = W * 0.58; }
  else { tx = W * 0.3; ty = H * 0.44; cx = W * 0.7; ch = H * 0.96; maxTW = W * 0.52; }
  const chars = [...(st.text || ' ')], len = chars.length;
  let fs;
  if (st.vertical) {
    fs = Math.min(200 * s, (portrait ? H * 0.42 : H * 0.7) / len);
    if (portrait) { tx = W * 0.2; ty = H * 0.3; } else { tx = W * 0.2; ty = H * 0.46; }
  } else fs = Math.min(240 * s, maxTW / (len * 1.02));
  const blockH = st.vertical ? fs * len * 1.02 : fs;
  return { s, portrait, tx, ty, chars, fs, blockH, maxTW,
    cx: cx + (st.posX / 100) * W * 0.5,
    cBottom: H - (st.posY / 100) * H * 0.5,
    ch: ch * st.scale };
}

// ---------- render ----------
function drawMain(c, L, x, y, fs, mode) {
  const chars = L.chars;
  c.font = FONTS[st.font](fs); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  const pos = st.vertical
    ? chars.map((ch, i) => [ch, x, y - L.blockH / 2 * (fs / L.fs) + fs * 1.02 * (i + 0.5)])
    : [[chars.join(''), x, y + fs * 0.04]];
  if (mode === 'echo') {
    c.strokeStyle = st.accent; c.lineWidth = fs * 0.05;
    pos.forEach(([s, px, py]) => c.strokeText(s, px, py));
    return;
  }
  const top = y - (st.vertical ? L.blockH * (fs / L.fs) : fs) / 2, bot = y + (st.vertical ? L.blockH * (fs / L.fs) : fs) / 2;
  let g;
  if (st.bg === 'niji') {
    const half = (st.vertical ? fs : fs * chars.length) * 0.6;
    g = c.createLinearGradient(x - half, top, x + half, bot);
    for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsl(${(i * 60 + curT * 240) % 360},100%,62%)`);
  } else {
    g = c.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.46, st.light); g.addColorStop(0.54, st.accent); g.addColorStop(1, mix(st.accent, '#000000', 0.35));
  }
  c.save(); c.shadowColor = rgba(st.accent, 0.9); c.shadowBlur = fs * 0.35;
  c.strokeStyle = '#0a0a0a'; c.lineWidth = fs * 0.2;
  pos.forEach(([s, px, py]) => c.strokeText(s, px, py));
  c.restore();
  c.strokeStyle = '#ffffff'; c.lineWidth = fs * 0.08;
  pos.forEach(([s, px, py]) => c.strokeText(s, px, py));
  c.fillStyle = g;
  pos.forEach(([s, px, py]) => c.fillText(s, px, py));
  // glossy light sweep across the letters
  const k = ((curT - T_IMP - 0.25) % 1.5) / 0.55;
  if (curT > T_IMP + 0.25 && k < 1) {
    const W = c.canvas.width, H = c.canvas.height;
    if (!offCv) offCv = document.createElement('canvas');
    if (offCv.width !== W || offCv.height !== H) { offCv.width = W; offCv.height = H; }
    const o = offCv.getContext('2d');
    o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, W, H);
    o.setTransform(c.getTransform());
    o.font = c.font; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
    pos.forEach(([s, px, py]) => o.fillText(s, px, py));
    o.globalCompositeOperation = 'source-in';
    const span = (st.vertical ? fs * 2 : fs * chars.length) * 0.9, sx = lerp(x - span, x + span, k);
    const sg = o.createLinearGradient(sx - fs * 0.5, top, sx + fs * 0.5, bot);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.95)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    o.fillStyle = sg; o.fillRect(-W, -H, W * 3, H * 3);
    o.globalCompositeOperation = 'source-over';
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(offCv, 0, 0); c.restore();
  }
}

function drawStick(c, x, y, len, s) {
  const h = 24 * s;
  c.save(); c.translate(x, y);
  c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 14 * s; c.shadowOffsetY = 5 * s;
  const g = c.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d9d2c0');
  c.fillStyle = g; c.beginPath(); c.roundRect(-len / 2, -h / 2, len, h, h / 2); c.fill();
  c.shadowColor = 'transparent';
  c.fillStyle = '#d42b23'; c.beginPath(); c.arc(0, 0, h * 0.3, 0, 7); c.fill();
  c.restore();
}

function render(c, t, W, H, opts = {}) {
  const L = layout(W, H), s = L.s, { ex, end } = timeline();
  const imp = T_IMP;
  c.save();
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  // impact shake
  const sk = t > imp && t < imp + 0.38 ? 1 - (t - imp) / 0.38 : 0;
  if (sk > 0) { const f = Math.floor(t * 60); c.translate((rnd(f) - 0.5) * 34 * s * sk, (rnd(f + 99) - 0.5) * 34 * s * sk); }
  curT = t;
  const beats = (SE[st.se].beats ? SE[st.se].beats() : []).slice(1);
  let pulse = 0, pulseHue = 0;
  beats.forEach((b, i) => { const k = (t - imp - b) / 0.14; if (k >= 0 && k < 1 && 1 - k > pulse) { pulse = 1 - k; pulseHue = (i * 67 + 300) % 360; } });
  if (pulse > 0) { const z = 1 + 0.03 * pulse; c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-W / 2, -H / 2); }

  // background, wiped in on a slant
  const wipe = outCubic(clamp(t / 0.32));
  if (wipe > 0) {
    c.save();
    const sl = H * 0.45, X = wipe * (W + sl * 2) - sl;
    c.beginPath(); c.moveTo(-sl - 60, -60); c.lineTo(X + sl, -60); c.lineTo(X - sl, H + 60); c.lineTo(-sl - 60, H + 60); c.closePath(); c.clip();
    BG[st.bg].draw(c, t, W, H, s, L);
    if (st.luxe && !opts.bgOnly) luxe(c, t, W, H, s, L);
    c.restore();
  }
  if (opts.bgOnly) { c.restore(); return; }

  // diagonal band behind the text
  const bp = outCubic(clamp((t - (imp - 0.12)) / 0.26)), bq = inCubic(clamp((t - ex) / 0.3));
  if (bp > 0 && bq < 1) {
    c.save(); c.translate(L.portrait ? W / 2 : L.tx, L.ty); c.rotate(-0.2);
    const bw = Math.hypot(W, H) * 1.4, bh = (st.vertical ? 300 * s : L.fs * 1.5 + 40 * s) * bp * (1 - bq);
    const g = c.createLinearGradient(0, -bh / 2, 0, bh / 2);
    g.addColorStop(0, rgba(st.accent, 0)); g.addColorStop(0.2, rgba(st.accent, 0.75)); g.addColorStop(0.8, rgba(st.accent, 0.75)); g.addColorStop(1, rgba(st.accent, 0));
    c.fillStyle = g; c.fillRect(-bw / 2, -bh / 2, bw, bh);
    // hairlines along both edges
    c.fillStyle = 'rgba(255,255,255,0.75)';
    c.fillRect(-bw / 2, -bh * 0.38, bw, 1.5 * s); c.fillRect(-bw / 2, bh * 0.38 - 1.5 * s, bw, 1.5 * s);
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.fillRect(-bw / 2, -bh * 0.38 + 5 * s, bw, 1 * s); c.fillRect(-bw / 2, bh * 0.38 - 6 * s, bw, 1 * s);
    const word = st.bandMode === 'main' ? st.text : st.bandMode === 'custom' ? st.bandText : '';
    const off0 = t * 180 * s;
    if (word && bh > 4) {
      c.font = FONTS[st.font](Math.max(8, bh * 0.4)); c.textBaseline = 'middle'; c.textAlign = 'left';
      c.strokeStyle = 'rgba(255,255,255,0.32)'; c.lineWidth = 1.5 * s; c.lineJoin = 'round';
      const unit = word + '\u3000\u25C6\u3000', ww = c.measureText(unit).width || 1, off = off0 % ww;
      for (let x = -bw / 2 - off; x < bw / 2; x += ww) c.strokeText(unit, x, 0);
    } else if (bh > 4) {
      const gap = 46 * s, off = off0 % gap, d = Math.min(7 * s, bh * 0.1);
      c.fillStyle = 'rgba(255,255,255,0.4)';

  const rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mime, videoBitsPerSecond: 10_000_000 });

  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => res({ im, url }); im.onerror = () => rej(new Error('bad image')); im.src = url;
  });
}
async function setCharFile(file) {
  if (!file || !file.type.startsWith('image/')) { msg('画像ファイル（PNG・JPG・WebP など）を選んでください。', true); return; }
  try { const { im, url } = await loadImage(file); st.img = im; $('#imgThumb').src = url; msg(`「${file.name || '貼り付けた画像'}」を読み込みました。▶ 再生で確認できます。`); drawStill(); }
  catch (e) { msg('画像を読み込めませんでした。別の形式で保存し直してみてください。', true); }
}
$('#imgInput').addEventListener('change', (e) => setCharFile(e.target.files[0]));
$('#bgInput').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const { im, url } = await loadImage(f); st.bgImg = im; $('#bgThumb').src = url; drawThumbs(); drawStill(); }
  catch (err) { msg('背景画像を読み込めませんでした。', true); }
});

const box = $('#stageBox');
box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('drag'); });
box.addEventListener('dragleave', () => box.classList.remove('drag'));
box.addEventListener('drop', (e) => { e.preventDefault(); box.classList.remove('drag'); setCharFile(e.dataTransfer.files[0]); });
document.addEventListener('paste', (e) => {
  if (e.target.matches && e.target.matches('input[type=text]')) return;
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (item) setCharFile(item.getAsFile());
});

$('#playBtn').addEventListener('click', () => play());
$('#recBtn').addEventListener('click', record);
$('#saveBtn').addEventListener('click', () => lastBlob && offer(`riichi.${lastExt}`, lastBlob));
$('#pngBtn').addEventListener('click', () => {
  render(ctx, heroT(), cv.width, cv.height);
  cv.toBlob((b) => b && offer('riichi.png', b), 'image/png');
});

// ---------- boot ----------
render(ctx, heroT(), cv.width, cv.height);
drawThumbs();
loadFonts().then(() => {
  const sample = makeSample();
  if (!st.img) st.img = sample;
  $('#imgThumb').src = sample.toDataURL();
  drawStill(); drawThumbs();
});
})();
</script>
